# configs/amr_config.yaml
# Dataset
train_db_name: 'amr'
fname: 'Data_AMR_Anomaly_v2.xlsx'
window_size: 7  # atau bisa pakai window_days: 7
num_neighbors: 10

# Model
model_name: 'lstm'  # atau 'resnet18', 'transformer'
model_kwargs:
  features_dim: 128
num_classes: 3  # Normal, Defect, Theft

# Training
epochs: 100
batch_size: 128
learning_rate: 0.001
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.0001

# Loss
criterion_kwargs:
  temperature: 0.5

# Paths
pretext_checkpoint: './checkpoints/amr_pretext_checkpoint.pth'
pretext_model: './models/amr_pretext_model.pth'
classification_checkpoint: './checkpoints/amr_classification_checkpoint.pth'
classification_model: './models/amr_classification_model.pth'

# Feature paths
pretext_features_train_path: './features/amr_train_features.npy'
pretext_features_test_path: './features/amr_test_features.npy'
topk_neighbors_train_path: './neighbors/amr_train_topk.npy'
bottomk_neighbors_train_path: './neighbors/amr_train_bottomk.npy'
topk_neighbors_val_path: './neighbors/amr_val_topk.npy'
bottomk_neighbors_val_path: './neighbors/amr_val_bottomk.npy'

# Other
update_cluster_head_only: False